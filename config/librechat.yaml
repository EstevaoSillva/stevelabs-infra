# Configuração do LibreChat para a POC Steve Lab.
# Dois endpoints:
#   1. "Agentes Steve Lab"  → serviço de agentes (Agno). Lê arquivos, cria subagentes,
#                           gera artefatos. Use para trabalho de verdade.
#   2. "Modelo direto"    → Ollama puro. Use para perguntas rápidas, sem ferramentas.
version: 1.3.13
cache: true
# Atenção: um erro de schema em qualquer ponto deste arquivo impede o LibreChat
# de subir. Mantenha o mínimo e valide a cada mudança.

endpoints:
  custom:
    - name: "Agentes Steve Lab"
      apiKey: "${AGENTES_API_KEY}"
      baseURL: "http://agentes:8000/v1"
      models:
        default: ["stevelab-agentes"]
        fetch: false
      titleConvo: false          # evita rodar o agente inteiro só para dar título à conversa
      modelDisplayLabel: "Agentes Steve Lab"
      dropParams: ["stop", "frequency_penalty", "presence_penalty", "top_p"]

    - name: "Modelo direto"
      apiKey: "ollama"
      baseURL: "${OLLAMA_BASE_URL}"
      models:
        default: ["gemma4:26b"]
        fetch: true
      titleConvo: true
      titleModel: "current_model"
      modelDisplayLabel: "Ollama"
